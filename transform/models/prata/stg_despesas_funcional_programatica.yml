version: 2

models:
  - name: stg_despesas_funcional_programatica
    description: >
      Despesas federais por funcional-programática tratadas.
      Inclui padronização de tipos e conversão dos valores monetários para double.

    columns:
      - name: ano
        description: Ano de referência da despesa.
        tests:
          - not_null

      - name: codigo_funcao
        description: Código da função orçamentária.
        tests:
          - not_null

      - name: codigo_subfuncao
        description: Código da subfunção orçamentária.

      - name: nome_funcao
        description: Nome da função orçamentária.
        tests:
          - not_null

      - name: nome_subfuncao
        description: Nome da subfunção orçamentária.

      - name: nome_programa
        description: Nome do programa governamental.

      - name: nome_acao
        description: Nome da ação orçamentária.

      - name: codigo_programa
        description: Código do programa governamental.

      - name: codigo_acao
        description: Código da ação orçamentária.

      - name: pacote
        description: Pacote utilizado para classificação dos dados.
        tests:
          - not_null
          - accepted_values:
              values:
                - politicas_sociais
                - infraestrutura
                - seguranca_estado
                - administracao_governo

      - name: valor_empenhado
        description: Valor empenhado no período.
        tests:
          - not_null

      - name: valor_liquidado
        description: Valor liquidado no período.
        tests:
          - not_null

      - name: valor_pago
        description: Valor efetivamente pago no período.
        tests:
          - not_null

      - name: __ingestion_id
        description: Identificador da carga de ingestão.

      - name: ingestion_time
        description: Data e hora da ingestão do registro.

      - name: __source
        description: Fonte de origem dos dados.

      - name: __endpoint
        description: Endpoint utilizado na ingestão dos dados.